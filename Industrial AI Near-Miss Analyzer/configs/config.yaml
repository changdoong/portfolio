# ------------------------------------------------------------
# Industrial AI Near-Miss Analyzer - 설정 파일
# ------------------------------------------------------------

video:
  # MVP: MP4 파일. (웹캠 인덱스 0 / rtsp:// URL 도 가능하나 RTSP 는 아직 미검증)
  source: "data/sample.mp4"
  resize_width: 1280          # null 이면 원본 해상도 유지
  rtsp:                       # RTSP 사용 시에만 적용 (미검증)
    reconnect_delay_sec: 2.0
    max_reconnect: 10

detection:
  model: "models/yolov8n.pt"  # COCO 80 클래스 사전학습. 다운로드 방법은 README 참고
  conf: 0.35
  iou: 0.5
  device: "cuda:0"            # CUDA 를 사용할 수 없으면 자동으로 cpu 전환
  half: true                  # CUDA 에서만 FP16 적용, CPU 에서는 자동 FP32
  imgsz: 640
  # COCO class id -> 분석용 카테고리 매핑
  # ※ COCO 에는 지게차(forklift) 클래스가 없음. truck/car 로 오검출되거나 놓칠 수 있음
  class_map:
    person: [0]
    vehicle: [2, 3, 5, 7]     # car, motorcycle, bus, truck

tracking:
  type: "bytetrack"           # bytetrack (기본) | iou (비교 실험용 자체 구현)
  tracker_config: "configs/bytetrack.yaml"   # type=bytetrack 일 때 ultralytics 에 전달
  history_len: 30             # 궤적 저장 길이
  max_age: 30                 # 이 프레임 수 이상 안 보이면 궤적 삭제
  iou:                        # type=iou 일 때만 사용
    iou_threshold: 0.3
    min_hits: 3

risk:
  # 위험 구역 (픽셀 좌표 다각형, resize 이후 기준) - 2일차에 실제 영상으로 재설정
  zones:
    - name: "Loading Dock"
      level: "danger"         # danger / warning
      polygon: [[100, 500], [600, 500], [600, 700], [100, 700]]
    - name: "Forklift Lane"
      level: "warning"
      polygon: [[700, 400], [1200, 400], [1200, 700], [700, 700]]

  zone_events:
    release_frames: 15        # 구역 밖에 이 프레임 수 연속으로 있어야 침입 종료
    cooldown_frames: 90       # 종료 후 같은 사람-구역 재기록 억제

  near_miss:
    # 바운딩 박스 하단 중앙점 간 픽셀 거리 (임시값 - 2일차에 실제 영상으로 조정)
    danger_px: 80
    warning_px: 150
    release_frames: 15        # 위험 해제가 이 프레임 수 연속되어야 에피소드 종료
    cooldown_frames: 45       # 종료 후 같은 사람-차량 쌍 재기록 억제
    enable_ttc: false         # 실험용. 픽셀 기반 TTC 는 부정확 → 호모그래피 적용 후 사용
    ttc_sec: 1.5
    min_closing_speed: 20.0   # px/sec

# 추적 결과 후처리 (Day 3, 기본 모두 비활성). 활성 예시: configs/day3_eval.yaml
analysis:
  id_merge:                   # ByteTrack ID 단절 병합 → canonical_track_id (원본 track_id 보존)
    enabled: false
    max_gap_frames: 30
    max_dist_px: 80
    use_velocity: true
  static_filter:              # 정지 설비 vehicle 을 근접 판정에서 제외 (이동 이력·큰 박스는 보호)
    enabled: false
    move_px: 25
    min_frames: 15
    protect_min_h_ratio: 0.2
    ignore_zones: []          # 카메라별 고정 설비 다각형 (픽셀, resize 이후 기준)
  role:                       # 운전자/보행자 구분: IoA + 운전석 위치 + 순변위 동시 이동
    enabled: false
    window: 15
    min_frames: 8
    ioa_thr: 0.5
    cab_ratio_thr: 0.6
    foot_margin_ratio: 0.05
    co_motion_tol: 0.5
    still_px: 1.0

perf:
  warmup_frames: 10           # FPS 통계에서 제외할 초기 프레임 수

output:
  save_video: true
  video_path: "outputs/result.mp4"
  event_log: "outputs/events.csv"
  perf_path: "outputs/perf.json"
  show_window: true
