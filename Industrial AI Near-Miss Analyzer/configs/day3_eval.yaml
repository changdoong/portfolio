# ------------------------------------------------------------
# Day 3 검증: ID 병합 / 정지 물체 필터 / 운전자 구분 활성화 (실제 CCTV, Mendeley CC BY 4.0)
#   .\.venv\Scripts\python.exe scripts\run_batch.py --videos configs\day3_eval.yaml --out outputs\day3\filtered
# 기본 설정(configs/config.yaml)에서는 세 기능 모두 비활성. ByteTrack 설정(configs/bytetrack.yaml)은 그대로 사용.
# ------------------------------------------------------------

meta:
  domain: "real_cctv"
  dataset: "mendeley_safe_unsafe (DOI 10.17632/xjmtb22pff.1, CC BY 4.0)"

videos:
  # Day 2 대표 영상 (근접 후보 이벤트 감사 대상)
  - {id: "7_tr21", path: "data/raw/mendeley_safe_unsafe/train/7_safe_carrying/7_tr21.mp4"}
  - {id: "3_tr6",  path: "data/raw/mendeley_safe_unsafe/train/3_carrying_overload_with_forklift/3_tr6.mp4"}
  - {id: "3_tr2",  path: "data/raw/mendeley_safe_unsafe/train/3_carrying_overload_with_forklift/3_tr2.mp4"}
  - {id: "3_tr19", path: "data/raw/mendeley_safe_unsafe/train/3_carrying_overload_with_forklift/3_tr19.mp4"}
  - {id: "7_te2",  path: "data/raw/mendeley_safe_unsafe/test/7_safe_carrying/7_te2.mp4"}
  # 86개 사전 조사에서 '운전자를 person 으로 오검출' 이 관찰된 영상
  - {id: "7_te6",  path: "data/raw/mendeley_safe_unsafe/test/7_safe_carrying/7_te6.mp4"}
  - {id: "7_te7",  path: "data/raw/mendeley_safe_unsafe/test/7_safe_carrying/7_te7.mp4"}
  - {id: "7_tr3",  path: "data/raw/mendeley_safe_unsafe/train/7_safe_carrying/7_tr3.mp4"}
  - {id: "7_tr13", path: "data/raw/mendeley_safe_unsafe/train/7_safe_carrying/7_tr13.mp4"}
  - {id: "7_tr15", path: "data/raw/mendeley_safe_unsafe/train/7_safe_carrying/7_tr15.mp4"}
  - {id: "3_tr36", path: "data/raw/mendeley_safe_unsafe/train/3_carrying_overload_with_forklift/3_tr36.mp4"}

conditions:
  precisions: ["fp16"]
  save_video: [true]

overrides:
  risk:
    zones: []
  perf:
    warmup_frames: 10
    stage_timing: true
  output:
    show_window: false
  analysis:
    id_merge:
      enabled: true
      max_gap_frames: 30
      max_dist_px: 80
      use_velocity: true
    static_filter:
      enabled: true
      move_px: 25
      min_frames: 15
      protect_min_h_ratio: 0.2
      # 이 카메라(1280x720) 좌상단 고정 설비(파란 카트/적재함). 이동 이력이 있는 차량은 구역 안이어도 보호됨
      ignore_zones:
        - [[40, 40], [200, 40], [200, 115], [40, 115]]
    role:
      enabled: true
      window: 15
      min_frames: 8
      ioa_thr: 0.5
      cab_ratio_thr: 0.6
      foot_margin_ratio: 0.05
      co_motion_tol: 0.5
      still_px: 1.0
